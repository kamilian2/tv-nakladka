<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Nakładka – ustawienia</title>
<style>
  :root { --bg:#0b1722; --card:#13263a; --line:#21405c; --txt:#e8f1f8; --mut:#8fb0c8; --acc:#18bcf2; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:22px; }
  header span { color:var(--mut); font-size:14px; }
  nav { display:flex; gap:6px; padding:12px 24px; flex-wrap:wrap; }
  nav button { background:var(--card); color:var(--txt); border:1px solid var(--line); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  nav button.on { background:var(--acc); border-color:var(--acc); color:#04212e; font-weight:600; }
  main { padding:0 24px 40px; max-width:900px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-top:12px; }
  .card h2 { margin:0 0 12px; font-size:17px; }
  .row { display:grid; grid-template-columns: 220px 1fr 70px; gap:12px; align-items:center; padding:7px 0; border-top:1px solid #1a3149; }
  .row:first-of-type { border-top:none; }
  .row label { color:var(--mut); font-size:14px; }
  .row input[type=range] { width:100%; accent-color:var(--acc); }
  .row output { text-align:right; font-variant-numeric: tabular-nums; }
  select, input[type=text], input[type=number], textarea {
    background:#0d1d2c; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:14px; width:100%;
  }
  textarea { min-height:90px; font-family: ui-monospace, Consolas, monospace; }
  .inline { display:flex; gap:8px; align-items:center; }
  .inline input[type=color] { width:44px; height:34px; border:none; background:none; padding:0; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .btns button { background:#21405c; color:var(--txt); border:none; padding:9px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  .btns button.main { background:var(--acc); color:#04212e; font-weight:600; }
  .hint { color:var(--mut); font-size:13px; margin-top:8px; line-height:1.5; }
  pre { background:#0d1d2c; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; font-size:12.5px; }
  #toast { position:fixed; right:18px; bottom:18px; background:var(--acc); color:#04212e; padding:10px 14px; border-radius:8px; font-weight:600; opacity:0; transition:opacity .2s; }
  #toast.show { opacity:1; }
  #toast.err { background:#e57373; }
  @media (max-width:640px){ .row { grid-template-columns: 1fr; } .row output { text-align:left; } }
</style>
</head>
<body>
<header><h1>TV Nakładka</h1><span id="ver"></span><span>Zmiany widać od razu na telewizorze.</span></header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="toast"></div>

<script>
const TABS = [["clock","Zegar"],["e1","Encja 1"],["e2","Encja 2"],["e3","Encja 3"],["e4","Encja 4"],["e5","Encja 5"],["camera","Kamery"],["other","Inne"],["keys","Pilot i kamery"],["ha","Home Assistant"]];
let S = null, tab = "clock", timers = {};

const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(timers.toast); timers.toast = setTimeout(() => t.className = "", 1400);
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ ok:false, error:"Brak odpowiedzi" }));
  if (!j.ok) toast(j.error || "Błąd", true);
  return j;
}

function save(sec, key, val) {
  S.config[sec][key] = val;
  const id = sec + "." + key;
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => api("/settings", { [sec]: { [key]: val } }), 120);
}

// ---------- pola formularza ----------
function range(sec, key, label, min, max, step) {
  const v = S.config[sec][key];
  const el = $(`<div class="row"><label>${label}</label><input type="range" min="${min}" max="${max}" step="${step||1}" value="${v}"><output>${v}</output></div>`);
  const inp = el.querySelector("input"), out = el.querySelector("output");
  inp.oninput = () => { out.textContent = inp.value; save(sec, key, Number(inp.value)); };
  return el;
}
function check(sec, key, label) {
  const el = $(`<div class="row"><label>${label}</label><div><input type="checkbox" ${S.config[sec][key] ? "checked" : ""}></div><output></output></div>`);
  el.querySelector("input").onchange = (e) => save(sec, key, e.target.checked);
  return el;
}
function select(sec, key, label, opts) {
  const v = S.config[sec][key];
  const known = opts.some(o => o.value === v);
  const html = opts.map(o => `<option value="${esc(o.value)}" ${o.value === v ? "selected" : ""}>${esc(o.name)}</option>`).join("")
             + (known ? "" : `<option value="${esc(v)}" selected>${esc(v)}</option>`);
  const el = $(`<div class="row"><label>${label}</label><select>${html}</select><output></output></div>`);
  el.querySelector("select").onchange = (e) => save(sec, key, e.target.value);
  return el;
}
function color(sec, key, label, presets) {
  const v = S.config[sec][key] || "#FFFFFF";
  const hex6 = "#" + v.replace("#","").slice(-6);
  const el = $(`<div class="row"><label>${label}</label>
      <div class="inline"><input type="color" value="${hex6}"><select>${presets.map(o => `<option value="${o.value}" ${o.value.toUpperCase()===v.toUpperCase()?"selected":""}>${esc(o.name)}</option>`).join("")}<option value="">własny…</option></select>
      <input type="text" value="${esc(v)}" style="width:120px"></div><output></output></div>`);
  const [picker, sel, txt] = el.querySelectorAll("input[type=color], select, input[type=text]");
  picker.oninput = () => { txt.value = picker.value.toUpperCase(); save(sec, key, txt.value); };
  sel.onchange = () => { if (sel.value) { txt.value = sel.value; picker.value = "#" + sel.value.replace("#","").slice(-6); save(sec, key, sel.value); } };
  txt.onchange = () => { save(sec, key, txt.value.trim()); };
  return el;
}
function card(title, ...children) {
  const c = $(`<div class="card"><h2>${title}</h2></div>`);
  children.forEach(ch => c.appendChild(ch));
  return c;
}
function buttons(list) {
  const b = $(`<div class="btns"></div>`);
  list.forEach(([label, fn, main]) => { const x = $(`<button class="${main?"main":""}">${label}</button>`); x.onclick = fn; b.appendChild(x); });
  return b;
}
async function reset(sections) {
  for (const s of sections) await api("/settings/reset", { section: s });
  await load(); toast("Przywrócono domyślne");
}

// ---------- zakładki ----------
function render() {
  const nav = document.getElementById("tabs"); nav.innerHTML = "";
  TABS.forEach(([k, n]) => { const b = $(`<button class="${k===tab?"on":""}">${n}</button>`); b.onclick = () => { tab = k; render(); }; nav.appendChild(b); });
  const m = document.getElementById("main"); m.innerHTML = "";
  const fonts = S.fonts, colors = S.colors, bgs = S.backgrounds;

  if (["clock","e1","e2","e3","e4","e5"].includes(tab)) {
    const sec = tab;
    const look = card("Wygląd i położenie",
      check(sec, "visible", "Widoczny"),
      range(sec, "x", "Poziomo (0 = lewo, 100 = prawo)", 0, 100, 0.5),
      range(sec, "y", "Pionowo (0 = góra, 100 = dół)", 0, 100, 0.5),
      range(sec, "size", "Wielkość czcionki", 10, 160, 1),
      select(sec, "font", "Krój czcionki", fonts),
      check(sec, "bold", "Pogrubienie"),
      color(sec, "color", "Kolor tekstu", colors),
      color(sec, "background", "Kolor tła", bgs),
      range(sec, "opacity", "Krycie tła % (0 = bez tła)", 0, 100, 1));
    if (sec === "clock") {
      look.appendChild(select(sec, "format", "Format godziny", S.formats.map(f => ({ value:f, name:f }))));
      const fr = $(`<div class="row"><label>Własny format</label><input type="text" placeholder="np. HH:mm:ss  EEEE" value="${esc(S.config.clock.format)}"><output></output></div>`);
      fr.querySelector("input").onchange = (e) => save("clock", "format", e.target.value);
      look.appendChild(fr);
      look.appendChild($(`<div class="hint">HH – godzina, mm – minuty, ss – sekundy, EEE – dzień tygodnia (skrót), EEEE – pełna nazwa, d.MM.yyyy – data. Czcionki cyfrowe pokazują tylko cyfry i dwukropek.</div>`));
    }
    look.appendChild(buttons([["Przywróć domyślne", () => reset([sec])]]));
    m.appendChild(look);

    if (sec !== "clock") {
      const c = S.config[sec];
      const txt = (id, label, key, ph) => {
        const el = $(`<div class="row"><label>${label}</label><input id="${id}" type="text" placeholder="${ph}" value="${esc(c[key])}"><output></output></div>`);
        const inp = el.querySelector("input");
        inp.oninput = () => save(sec, key, inp.value.trim());
        return el;
      };
      const haCard = card("Encja z Home Assistanta",
        $(`<div class="row"><label>Encja</label><div class="inline" style="width:100%"><input id="ent" type="text" list="entlist" autocomplete="off" autocapitalize="off" placeholder="np. sensor.siedlce_temperatura" value="${esc(c.entity)}"><datalist id="entlist"></datalist></div><output></output></div>`),
        select(sec, "mode", "Co pokazać", [
          { value:"value", name:"Sama wartość" },
          { value:"name_value", name:"Nazwa + wartość" },
          { value:"name", name:"Sama nazwa" }]),
        txt("lab", "Własna nazwa (puste = z HA)", "label", "np. Na zewnątrz"),
        txt("ico", "Ikona (puste = z HA)", "icon", "np. mdi:thermometer"),
        range(sec, "decimals", "Miejsca po przecinku (-1 = bez zmian)", -1, 3, 1),
        check(sec, "unit", "Pokaż jednostkę"));
      const ent = haCard.querySelector("#ent");
      ent.oninput = () => { clearTimeout(timers.ent); timers.ent = setTimeout(() => save(sec, "entity", ent.value.trim()), 500); };
      ent.onchange = () => save(sec, "entity", ent.value.trim());
      haCard.appendChild(buttons([["Usuń encję z pola", () => { save(sec, "entity", ""); ent.value = ""; }]]));
      haCard.appendChild($(`<div class="hint" id="slotstat">Stan: ${esc((S.ha_slots || {})[sec] || S.ha_status || "-")}</div>`));
      m.appendChild(haCard);

      const cond = card("Kiedy pokazywać",
        select(sec, "show_when", "Pokazuj", [
          { value:"always", name:"Zawsze" },
          { value:"above", name:"Gdy wartość większa niż…" },
          { value:"below", name:"Gdy wartość mniejsza niż…" },
          { value:"equals", name:"Gdy stan równy…" },
          { value:"not_equals", name:"Gdy stan różny od…" }]));
      const th = $(`<div class="row"><label>Próg (liczba)</label><input type="number" step="any" value="${esc(c.threshold)}"><output></output></div>`);
      th.querySelector("input").oninput = (e) => { const v = parseFloat(e.target.value); if (!isNaN(v)) save(sec, "threshold", v); };
      cond.appendChild(th);
      cond.appendChild(txt("match", "Stan tekstowy (dla „równy/różny”)", "match", "np. on, home, open – puste = porównaj z progiem"));
      cond.appendChild(check(sec, "on_demand", "Tylko na żądanie (przycisk pilota)"));
      cond.appendChild(range(sec, "demand_seconds", "Na żądanie – czas pokazania (s, 0 = do ponownego naciśnięcia)", 0, 120, 1));
      cond.appendChild($(`<div class="hint">„Na żądanie”: pole jest ukryte, dopóki nie naciśniesz przypisanego przycisku pilota (zakładka „Pilot i kamery” → akcja „Pokaż: …”).</div>`));
      cond.appendChild($(`<div class="hint">Przykład: produkcja PV pokazywana tylko powyżej 100 W → „Gdy wartość większa niż…”, próg 100. Gdy warunek nie jest spełniony, pole znika z ekranu.</div>`));
      m.appendChild(cond);
      loadEntities();
    }
  }

  if (tab === "camera") {
    const c = card("Kamery (zawsze na dole ekranu)",
      range("camera", "width", "Szerokość okienka", 160, 900, 10),
      range("camera", "gap", "Odstęp między okienkami", 0, 80, 1),
      select("camera", "align", "Wyrównanie", [{value:"start",name:"Do lewej"},{value:"center",name:"Na środku"},{value:"end",name:"Do prawej"}]),
      range("camera", "bottom", "Odległość od dołu", 0, 400, 2),
      range("camera", "max_seconds", "Maksymalny czas (s)", 5, 120, 1));
    c.appendChild(buttons([["Przywróć domyślne", () => reset(["camera"])]]));
    m.appendChild(c);
    const saved = localStorage.getItem("cams") || "";
    const t = card("Test kamer",
      $(`<div class="hint">Adresy RTSP – jeden w linii (maks. kilka okienek).</div>`),
      $(`<textarea id="cams" placeholder="rtsp://login:haslo@192.168.1.50:554/stream2">${esc(saved)}</textarea>`));
    t.appendChild(buttons([
      ["Pokaż na TV", () => { const v = document.getElementById("cams").value; try { localStorage.setItem("cams", v); } catch(e){}
        api("/camera", { streams: v.split(/\n/).map(s => s.trim()).filter(Boolean) }).then(j => j.ok && toast("Wysłano")); }, true],
      ["Zamknij", () => api("/camera/stop", {})]
    ]));
    m.appendChild(t);
  }

  if (tab === "other") {
    const corners = [["top_start","Lewy górny"],["top_center","Górny środek"],["top_end","Prawy górny"],["bottom_start","Lewy dolny"],["bottom_center","Dolny środek"],["bottom_end","Prawy dolny"]].map(([value,name]) => ({value,name}));
    const c = card("Ogólne", range("general", "margin", "Margines od krawędzi ekranu", 0, 120, 1));
    m.appendChild(c);
    const n = card("Powiadomienia",
      select("notify", "corner", "Róg ekranu", corners),
      range("notify", "size", "Wielkość", 10, 60, 1),
      range("notify", "duration", "Czas wyświetlania (s)", 2, 120, 1),
      select("notify", "font", "Krój czcionki", fonts),
      color("notify", "background", "Kolor tła", bgs),
      range("notify", "opacity", "Krycie tła %", 0, 100, 1));
    n.appendChild(buttons([
      ["Wyślij testowe", () => api("/notify", { title:"Test", message:"Powiadomienie z przeglądarki", icon:"mdi:bell" }), true],
      ["Przywróć domyślne", () => reset(["general","notify"])]
    ]));
    m.appendChild(n);
  }

  if (tab === "keys") {
    const cams = card("Zapisane kamery");
    for (let i = 1; i <= 6; i++) {
      const nm = $(`<div class="row"><label>Kamera ${i} – nazwa</label><input type="text" value="${esc(S.config.cams["c"+i+"_name"])}"><output></output></div>`);
      nm.querySelector("input").oninput = (e) => save("cams", "c"+i+"_name", e.target.value);
      const ur = $(`<div class="row"><label>Kamera ${i} – adres RTSP</label><input type="text" autocapitalize="off" autocomplete="off" placeholder="rtsp://login:haslo@192.168.1.50:554/stream2" value="${esc(S.config.cams["c"+i+"_url"])}"><button>Pokaż</button></div>`);
      ur.querySelector("input").oninput = (e) => save("cams", "c"+i+"_url", e.target.value.trim());
      const b = ur.querySelector("button");
      b.style.cssText = "background:#21405c;color:#e8f1f8;border:none;border-radius:8px;padding:8px;cursor:pointer";
      b.onclick = () => setTimeout(() => api("/camera", { cams:[i] }).then(j => j.ok && toast("Wysłano")), 300);
      cams.appendChild(nm); cams.appendChild(ur);
    }
    m.appendChild(cams);

    const keys = card("Przyciski pilota",
      $(`<div class="hint" style="margin-top:0">${S.key_service
        ? "Usługa przycisków: <b>włączona ✔</b> – przyciski działają w każdej aplikacji (TV, Netflix, YouTube)."
        : "Usługa przycisków: <b>wyłączona</b>. Włącz ją z komputera (w folderze z adb):<br><code>adb shell settings put secure enabled_accessibility_services pl.kamil.tvnakladka/pl.kamil.tvnakladka.KeyService</code><br><code>adb shell settings put secure accessibility_enabled 1</code>"}</div>`));
    for (let i = 1; i <= 6; i++) {
      const k = "k" + i, name = S.config.keys[k+"_name"];
      keys.appendChild(select("keys", k+"_action", `Przycisk ${i}: <b>${esc(name || "nie przypisano")}</b>`, S.key_actions));
      keys.appendChild(buttons([
        [`Naucz przycisk ${i}`, async () => {
          const j = await api("/keys/learn", { slot:k });
          if (!j.ok) return;
          toast("Naciśnij teraz przycisk na pilocie…");
          for (let t = 0; t < 32; t++) {
            await new Promise(r => setTimeout(r, 500));
            const st = await (await fetch("/status")).json();
            if (!st.learning) { await load(); if (st.last_learned) toast("Zapisano: " + st.last_learned.split(":")[1]); return; }
          }
        }],
        ["Usuń", () => api("/settings", { keys: { [k+"_code"]:0, [k+"_name"]:"", [k+"_action"]:"none" } }).then(load)]
      ]));
    }
    keys.appendChild(check("general", "back_closes", "Przycisk Wstecz zamyka kamery"));
    keys.appendChild($(`<div class="hint">Najlepiej użyć kolorowych przycisków pilota (czerwony, zielony, żółty, niebieski) – w zwykłym oglądaniu rzadko są potrzebne. Przypisany przycisk przestaje działać w innych aplikacjach. Ponowne naciśnięcie zamyka kamerę.</div>`));
    m.appendChild(keys);
  }

  if (tab === "ha") {
    const h = S.config.ha;
    const conn = card("Połączenie z Home Assistantem",
      $(`<div class="row"><label>Adres HA</label><input id="haurl" type="text" placeholder="http://192.168.1.10:8123" value="${esc(h.url)}"><output></output></div>`),
      $(`<div class="row"><label>Token (długoterminowy)</label><input id="hatok" type="password" placeholder="${h.token_set ? "zapisany – wpisz nowy, aby zmienić" : "wklej token"}"><output></output></div>`),
      range("ha", "interval", "Odświeżanie co (s)", 1, 120, 1));
    conn.appendChild(buttons([
      ["Zapisz", async () => {
        const url = document.getElementById("haurl").value.trim(), token = document.getElementById("hatok").value.trim();
        const j = await api("/settings", { ha: { url, token } });
        if (j.ok) { toast("Zapisano"); entities = null; await load(); }
      }, true],
      ["Testuj połączenie", async () => {
        const url = document.getElementById("haurl").value.trim(), token = document.getElementById("hatok").value.trim();
        const j = await api("/ha/test", { url, token });
        if (j.ok) toast("Połączono: " + j.message);
      }]
    ]));
    conn.appendChild($(`<div class="hint">Token utworzysz w HA: kliknij swój profil (lewy dolny róg) → zakładka Bezpieczeństwo → Tokeny długoterminowe → Utwórz token. Token jest zapisany tylko w telewizorze i nie jest pokazywany na tej stronie.<br>Stan: ${esc(S.ha_status || "-")}</div>`));
    m.appendChild(conn);

    const base = location.protocol + "//" + location.host;
    m.appendChild(card("Kod do configuration.yaml",
      $(`<pre>${esc(`rest_command:
  tv_encja:
    url: "${base}/entity"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: >
      {{ {"slot": slot, "text": text, "icon": icon | default(""),
          "color": color | default(""), "expiration": expiration | default(0)} | to_json }}

  tv_powiadomienie:
    url: "${base}/notify"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: >
      {{ {"title": title | default(""), "message": message | default(""),
          "icon": icon | default("mdi:home-assistant"),
          "duration": duration | default(10)} | to_json }}

  tv_kamery:
    url: "${base}/camera"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: '{{ {"streams": streams, "duration": duration | default(30)} | to_json }}'

  tv_kamera_zapisana:
    url: "${base}/camera"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: '{{ {"cams": cams, "duration": duration | default(30)} | to_json }}'

  tv_ustawienia:
    url: "${base}/settings"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: "{{ ustawienia | to_json }}"`)}</pre>`)));
    m.appendChild(card("Przykład: pogoda w polu 1",
      $(`<pre>${esc(`action: rest_command.tv_encja
data:
  slot: 1
  text: "{{ states('sensor.siedlce_temperatura') }} °C"
  icon: "mdi:weather-partly-cloudy"`)}</pre>`)));
    m.appendChild(card("Przykład: zapisane kamery 1 i 3 przy dzwonku",
      $(`<pre>${esc(`action: rest_command.tv_kamera_zapisana
data:
  cams: [1, 3]`)}</pre>`)));
    m.appendChild(card("Przykład: zmiana ustawień z HA",
      $(`<pre>${esc(`action: rest_command.tv_ustawienia
data:
  ustawienia:
    clock: { x: 100, y: 0, size: 40, font: "asset:dseg7" }
    e1: { x: 0, y: 0 }`)}</pre>`)));
  }
}

let entities = null;
async function loadEntities() {
  const dl = document.getElementById("entlist");
  if (!dl) return;
  if (!entities) {
    if (!S.config.ha.url || !S.config.ha.token_set) return;
    try { const r = await fetch("/ha/entities"); const j = await r.json(); if (j.ok) entities = j.entities; } catch (e) {}
  }
  if (!entities) return;
  dl.innerHTML = entities.map(e => `<option value="${esc(e.entity_id)}">${esc(e.name)} – ${esc(e.state)} ${esc(e.unit)}</option>`).join("");
}

async function load() {
  const j = await api("/config");
  if (!j.ok) return;
  S = j;
  document.getElementById("ver").textContent = "wersja " + j.version;
  render();
}

// tryb edycji: na TV widać puste pola z podpisami, dopóki strona jest otwarta
function editOn() { fetch("/edit", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ on:true, seconds:90 }) }).catch(()=>{}); }
setInterval(editOn, 60000);
window.addEventListener("pagehide", () => { try { navigator.sendBeacon("/edit", JSON.stringify({ on:false })); } catch(e){} });

setInterval(async () => {
  const el = document.getElementById("slotstat");
  if (!el || !S) return;
  try {
    const j = await (await fetch("/status")).json();
    S.ha_slots = j.ha_slots; S.ha_status = j.ha_status;
    el.textContent = "Stan: " + ((j.ha_slots || {})[tab] || j.ha_status || "-");
  } catch (e) {}
}, 3000);

editOn();
load();
</script>
