# Każdą automatyzację wklejasz osobno:
# Ustawienia → Automatyzacje → Utwórz → ⋮ → Edytuj w YAML

# --- 1. Pola na encje: pogoda, PV, zmywarka ---
alias: "TV: pola z encjami"
mode: queued
triggers:
  - trigger: state
    entity_id:
      - sensor.siedlce_temperatura
      - sensor.produkcja_pv1_pv2
      - binary_sensor.zmywarka_status
  - trigger: time_pattern
    minutes: "/10"
  - trigger: homeassistant
    event: start
actions:
  - action: rest_command.tv_encja
    continue_on_error: true
    data:
      slot: 1
      text: "{{ states('sensor.siedlce_temperatura') | float(0) | round(1) }} °C"
      icon: "mdi:thermometer"
  - action: rest_command.tv_encja
    continue_on_error: true
    data:
      slot: 2
      text: "{{ states('sensor.produkcja_pv1_pv2') | int(0) }} W"
      icon: "mdi:solar-power"
      color: "{{ '#FFD54F' if states('sensor.produkcja_pv1_pv2') | int(0) > 50 else '#B0BEC5' }}"
  - action: rest_command.tv_encja
    continue_on_error: true
    data:
      slot: 3
      text: "{{ 'Zmywarka pracuje' if is_state('binary_sensor.zmywarka_status', 'on') else 'Zmywarka gotowa' }}"
      icon: "mdi:dishwasher"

---
# --- 2. Trzy kamery na dole ekranu przy ruchu (maks. 30 s) ---
alias: "TV: 3 kamery przy ruchu"
mode: single
triggers:
  - trigger: state
    entity_id: binary_sensor.TWOJ_CZUJNIK_RUCHU
    to: "on"
actions:
  - action: rest_command.tv_kamery
    continue_on_error: true
    data:
      duration: 30
      streams:
        - "rtsp://LOGIN:HASLO@IP_KAMERY1:554/SCIEZKA"
        - "rtsp://LOGIN:HASLO@IP_KAMERY2:554/SCIEZKA"
        - "rtsp://LOGIN:HASLO@IP_KAMERY3:554/SCIEZKA"
  - delay: "00:01:00"

---
# --- 3. Zmywarka skończyła – powiadomienie ---
alias: "TV: zmywarka skończyła"
triggers:
  - trigger: state
    entity_id: binary_sensor.zmywarka_status
    from: "on"
    to: "off"
actions:
  - action: rest_command.tv_powiadomienie
    continue_on_error: true
    data:
      title: "Zmywarka"
      message: "Cykl zakończony"
      icon: "mdi:dishwasher"
      duration: 15
