# Wklej do configuration.yaml (zamiast poprzedniej sekcji rest_command)
# IP telewizora: 192.168.1.114, port aplikacji TV Nakładka: 5002
# Strona ustawień w przeglądarce: http://192.168.1.114:5002

rest_command:
  # Treść jednego z 3 pól na encje (slot 1, 2 lub 3)
  tv_encja:
    url: "http://192.168.1.114:5002/entity"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: >
      {{ {"slot": slot,
          "text": text | default(""),
          "icon": icon | default(""),
          "color": color | default(""),
          "expiration": expiration | default(0)} | to_json }}

  # Wyczyszczenie pola (bez slot = wszystkie)
  tv_encja_wyczysc:
    url: "http://192.168.1.114:5002/entity/clear"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: '{{ {"slot": slot | default("")} | to_json }}'

  # Wyskakujące powiadomienie
  tv_powiadomienie:
    url: "http://192.168.1.114:5002/notify"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: >
      {{ {"title": title | default(""),
          "message": message | default(""),
          "icon": icon | default("mdi:home-assistant"),
          "duration": duration | default(10)} | to_json }}

  # Kamery – zawsze na dole ekranu, maks. 30 s (ustawiane na TV / na stronie)
  tv_kamery:
    url: "http://192.168.1.114:5002/camera"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: >
      {{ {"streams": streams, "duration": duration | default(30)} | to_json }}

  # Zapisane kamery (adresy ustawione w aplikacji), np. cams: [1, 3]
  tv_kamera_zapisana:
    url: "http://192.168.1.114:5002/camera"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: >
      {{ {"cams": cams, "duration": duration | default(30)} | to_json }}

  tv_kamery_stop:
    url: "http://192.168.1.114:5002/camera/stop"
    method: POST
    timeout: 5

  # Zmiana ustawień (położenie, czcionki, kolory) z HA
  tv_ustawienia:
    url: "http://192.168.1.114:5002/settings"
    method: POST
    content_type: "application/json; charset=utf-8"
    timeout: 5
    payload: "{{ ustawienia | to_json }}"
